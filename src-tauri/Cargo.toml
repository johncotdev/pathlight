[package]
name = "pathlight"
version = "0.1.1"
description = "Fast visual disk usage explorer"
authors = ["Pathlight"]
edition = "2021"

[lib]
name = "pathlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pathlight"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
jwalk = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.7.1"
trash = "5.2.6"
